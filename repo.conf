# Configuration for repo.sh
# To override locally without modifying git-tracked files, create repo.local.conf

# Destination directory for built packages and signatures
REPO_DIR="/mnt/hdd/SteavenRepo/x86_64"

# Scratch directory where packages are copied and built
BUILD_DIR="${HOME}/ah"

# Flags passed to makepkg
MAKEPKG_FLAGS=(-sr --sign)

# Path to the pacman repo database (e.g. "${REPO_DIR}/SteavenRepo.db.tar.zst").
# Leave empty to auto-detect *.db.tar.* inside REPO_DIR.
REPO_DB=""

# Set to 1 to automatically run repo-add after building packages, 0 to skip
UPDATE_DB=1

# Extra flags passed to repo-add (e.g. (--sign))
REPO_ADD_FLAGS=(--sign)

# Parallel jobs for git submodule update
UPDATE_JOBS=8

